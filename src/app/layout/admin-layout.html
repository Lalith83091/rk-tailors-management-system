<div class="admin-shell">
  <button class="mobile-menu" type="button" aria-label="Open menu" (click)="navOpen = !navOpen"><i class="bi bi-list"></i></button>
  <aside class="admin-sidebar" [class.visible]="navOpen">
    <a class="admin-brand" routerLink="/"><span class="brand-mark">RK</span><span><strong>R.K. TAILORS</strong><small>GENTS SPECIALIST</small></span></a>
    <div class="sidebar-label">WORKSPACE</div>
    <nav>
      <a routerLink="/dashboard" routerLinkActive="active" (click)="navOpen = false"><i class="bi bi-grid-1x2"></i> Dashboard</a>
      <a routerLink="/customers" routerLinkActive="active" (click)="navOpen = false"><i class="bi bi-people"></i> Customers</a>
      <a routerLink="/measurements" routerLinkActive="active" (click)="navOpen = false"><i class="bi bi-rulers"></i> Measurements</a>
      <a routerLink="/orders" routerLinkActive="active" (click)="navOpen = false"><i class="bi bi-scissors"></i> Orders</a>
      <a routerLink="/payments" routerLinkActive="active" (click)="navOpen = false"><i class="bi bi-credit-card"></i> Payments</a>
      <a routerLink="/reports" routerLinkActive="active" (click)="navOpen = false"><i class="bi bi-bar-chart"></i> Reports</a>
    </nav>
    <div class="sidebar-bottom">
      <div class="user-chip"><span class="avatar">{{ auth.user()?.email?.slice(0, 1)?.toUpperCase() }}</span><span><b>Shop administrator</b><small>{{ auth.user()?.email }}</small></span></div>
      <button type="button" class="signout-button" (click)="signOut()"><i class="bi bi-box-arrow-right"></i> Sign out</button>
      <a class="back-home" routerLink="/"><i class="bi bi-arrow-left"></i> Back to website</a>
    </div>
  </aside>
  <div class="admin-main">
    <header class="admin-topbar"><div><span class="topbar-date">{{ today }}</span><strong>Welcome to your workspace</strong></div><a href="tel:9292151645"><i class="bi bi-headset"></i> 92921 51645</a></header>
    <main class="admin-content"><router-outlet /></main>
  </div>
</div>
